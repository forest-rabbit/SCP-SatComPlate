[project]
name = "satcompute-tools"
version = "0.1.0"
description = "Python tools for SatCompute"
requires-python = ">=3.10,<3.11"
dependencies = [
    "astropy>=6.1.7",
    "ephem>=4.2.1",
    "sgp4>=2.27",
]

[dependency-groups]
visualization = [
    "matplotlib>=3.9,<4",
    "pillow>=10,<13",
]

[tool.uv]
package = false
required-version = "==0.11.25"

name: SatCompute CI

on:
  push:
    branches: [main]
    paths:
      - "contrib/satcompute/**"
      - ".github/workflows/per_commit.yml"
  pull_request:
    paths:
      - "contrib/satcompute/**"
      - ".github/workflows/per_commit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satcompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake g++ ninja-build python3

      - name: Configure SatCompute only
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: ./ns3 configure --enable-modules=satcompute -G Ninja

      - name: Build SatCompute and dependencies
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: ./ns3 build

      - name: Run SatCompute unit tests
        if: ${{ hashFiles('contrib/satcompute/tests/unit/test_*.py') != '' }}
        run: >-
          python3 -m unittest discover
          -s contrib/satcompute/tests/unit
          -p 'test_*.py'
          -v

      - name: Run SatCompute smoke tests
        if: ${{ hashFiles('contrib/satcompute/tests/integration/smoke/run-all.sh') != '' }}
        run: contrib/satcompute/tests/integration/smoke/run-all.sh

      - name: Run SatCompute regression tests
        if: ${{ hashFiles('contrib/satcompute/tests/integration/regression/run-all.sh') != '' }}
        run: contrib/satcompute/tests/integration/regression/run-all.sh

      - name: Confirm foundation-only change
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') == '' }}
        run: echo "SatCompute module has not been added yet; no ns-3 suite is run."

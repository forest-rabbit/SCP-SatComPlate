name: SatCompute CI

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Completed project phase (for example: documentation-cleanup)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  satcompute:
    name: SatCompute CI (${{ inputs.phase }})
    runs-on: ubuntu-latest
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ccache cmake g++ ninja-build python3

      - name: Restore compiler cache
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        uses: actions/cache@v6
        with:
          path: .ccache
          key: satcompute-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            satcompute-ccache-${{ runner.os }}-

      - name: Configure SatCompute only
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: ./ns3 configure --enable-modules=satcompute -G Ninja

      - name: Build SatCompute and dependencies
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: ./ns3 build

      - name: Report compiler cache
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') != '' }}
        run: ccache --show-stats

      - name: Run SatCompute unit tests
        if: ${{ hashFiles('contrib/satcompute/tests/unit/test_*.py') != '' }}
        run: >-
          python3 -m unittest discover
          -s contrib/satcompute/tests/unit
          -p 'test_*.py'
          -v

      - name: Run SatCompute C++ unit tests
        if: ${{ hashFiles('contrib/satcompute/tests/unit/run-cpp-tests.sh') != '' }}
        run: contrib/satcompute/tests/unit/run-cpp-tests.sh

      - name: Run SatCompute smoke tests
        if: ${{ hashFiles('contrib/satcompute/tests/integration/smoke/run-all.sh') != '' }}
        run: contrib/satcompute/tests/integration/smoke/run-all.sh

      - name: Run SatCompute regression tests
        if: ${{ hashFiles('contrib/satcompute/tests/integration/regression/run-all.sh') != '' }}
        run: contrib/satcompute/tests/integration/regression/run-all.sh

      - name: Confirm foundation-only change
        if: ${{ hashFiles('contrib/satcompute/CMakeLists.txt') == '' }}
        run: echo "SatCompute module has not been added yet; no ns-3 suite is run."

name: SatCompute Fast Smoke

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: satcompute-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-smoke:
    name: fast-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.25"
          python-version: "3.10.12"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Configure
        run: ./waf configure --disable-examples --disable-tests --enable-modules=satcompute

      - name: Build
        run: ./waf build

      - name: Generate and check unified scenario
        run: |
          uv run --locked python -m \
            contrib.satcompute.tools.generation.scenario.generate_scenario \
            --config contrib/satcompute/tools/generation/scenario/config/synthetic-66-compute-22.json \
            --output-dir /tmp/satcompute-fast-scenario
          uv run --locked python -m \
            contrib.satcompute.tools.generation.scenario.check_scenario \
            --input-dir /tmp/satcompute-fast-scenario

      - name: Load generated scenario topology in SatCompute
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=/tmp/satcompute-fast-scenario/topology \
            --simulationDuration=2 \
            --outputDir=/tmp/satcompute-fast-topology-output" \
            | tee /tmp/satcompute-fast-topology.log
          grep -Fq "  discovered : 1001" /tmp/satcompute-fast-topology.log
          grep -Fq "  selected   : 3" /tmp/satcompute-fast-topology.log
          grep -Fq "  updates    : 2" /tmp/satcompute-fast-topology.log
          grep -Fq "[TOPO:Update] @ 2s" /tmp/satcompute-fast-topology.log
          grep -Fq "  satellites : 66" /tmp/satcompute-fast-topology.log
          grep -Fq "  ISLs       : 121" /tmp/satcompute-fast-topology.log
          grep -Fq "  run status          : COMPLETE" \
            /tmp/satcompute-fast-topology.log

      - name: Run task with generated compute profile
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=/tmp/satcompute-fast-scenario/topology \
            --computeProfile=/tmp/satcompute-fast-scenario/resources/compute-profile.json \
            --taskTrace=contrib/satcompute/tests/fixtures/scenario-generation/task-single-selected.json \
            --simulationDuration=3 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-fast-scenario-task"
          python3 contrib/satcompute/tools/validation/check-task-output.py run \
            --topology-dir=/tmp/satcompute-fast-scenario/topology \
            --compute-profile=/tmp/satcompute-fast-scenario/resources/compute-profile.json \
            --task-trace=contrib/satcompute/tests/fixtures/scenario-generation/task-single-selected.json \
            --workload-summary=contrib/satcompute/tests/fixtures/scenario-generation/task-single-selected-summary.json \
            --output-dir=/tmp/satcompute-fast-scenario-task

      - name: Routing contracts
        run: contrib/satcompute/tools/ci/run-routing-smoke.sh

      - name: Task contracts
        run: contrib/satcompute/tools/ci/run-task-smoke.sh

      - name: Diagnostics contracts
        run: contrib/satcompute/tools/ci/run-diagnostics-smoke.sh

      - name: Verify clean source tree
        run: test -z "$(git status --short)"

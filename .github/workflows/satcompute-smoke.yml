name: SatCompute deterministic smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: satcompute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: ./waf configure --disable-examples --disable-tests --enable-modules=satcompute

      - name: Build
        run: ./waf build

      - name: Static diamond repeat
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-static-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=verbose \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-static-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-static-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=verbose \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-static-b"

      - name: Dynamic diamond
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-dynamic \
            --simulationDuration=6 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-dynamic-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=verbose \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-dynamic"

      - name: Stable HRW dynamic epochs
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-hrw-dynamic \
            --simulationDuration=7 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-hrw-dynamic-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=64000 \
            --islMtuBytes=65535 \
            --islQueueBytes=64000000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-hrw-seed1-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-hrw-dynamic \
            --simulationDuration=7 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-hrw-dynamic-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=64000 \
            --islMtuBytes=65535 \
            --islQueueBytes=64000000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-hrw-seed1-b"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-hrw-dynamic \
            --simulationDuration=7 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-hrw-dynamic-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=64000 \
            --islMtuBytes=65535 \
            --islQueueBytes=64000000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=2 \
            --outputDir=/tmp/satcompute-ci-hrw-seed2-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-hrw-dynamic \
            --simulationDuration=7 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/diamond-4-hrw-dynamic-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=64000 \
            --islMtuBytes=65535 \
            --islQueueBytes=64000000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=2 \
            --outputDir=/tmp/satcompute-ci-hrw-seed2-b"
          python3 contrib/satcompute/tools/validation/check-ecmp-output.py \
            --hrw-first=/tmp/satcompute-ci-hrw-seed1-a \
            --hrw-second=/tmp/satcompute-ci-hrw-seed1-b \
            --hrw-seed-two-first=/tmp/satcompute-ci-hrw-seed2-a \
            --hrw-seed-two-second=/tmp/satcompute-ci-hrw-seed2-b

      - name: Size-aware HRW lifecycle
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --simulationDuration=2 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/size-aware-static-transfers.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=64000 \
            --islMtuBytes=65535 \
            --islQueueBytes=64000000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-size-static-hrw"
          for suffix in a b; do
            ./waf --run-no-build "satcompute \
              --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
              --simulationDuration=2 \
              --offeredLoad=0 \
              --transferTrace=contrib/satcompute/input/traffic/json/test/size-aware-static-transfers.json \
              --transferChunkMode=fixed \
              --transferPayloadBytes=64000 \
              --islMtuBytes=65535 \
              --islQueueBytes=64000000 \
              --transferLogMode=silent \
              --routingMode=global-size-aware-hrw \
              --ecmpHashSeed=1 \
              --outputDir=/tmp/satcompute-ci-size-static-$suffix"
            ./waf --run-no-build "satcompute \
              --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-hrw-dynamic \
              --simulationDuration=7 \
              --offeredLoad=0 \
              --transferTrace=contrib/satcompute/input/traffic/json/test/size-aware-dynamic-transfers.json \
              --transferChunkMode=fixed \
              --transferPayloadBytes=64000 \
              --islMtuBytes=65535 \
              --islQueueBytes=64000000 \
              --transferLogMode=silent \
              --routingMode=global-size-aware-hrw \
              --ecmpHashSeed=1 \
              --outputDir=/tmp/satcompute-ci-size-dynamic-$suffix"
          done
          python3 contrib/satcompute/tools/validation/check-size-aware-output.py \
            --static-hrw=/tmp/satcompute-ci-size-static-hrw \
            --static-first=/tmp/satcompute-ci-size-static-a \
            --static-second=/tmp/satcompute-ci-size-static-b \
            --dynamic-first=/tmp/satcompute-ci-size-dynamic-a \
            --dynamic-second=/tmp/satcompute-ci-size-dynamic-b

      - name: Canonical endpoint and remainder
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/canonical-order-a \
            --simulationDuration=1 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/canonical-order-a.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-canonical-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/canonical-order-b \
            --simulationDuration=1 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/canonical-order-b.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-canonical-order-b"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/canonical-endpoint-reversed \
            --simulationDuration=1 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/canonical-order-a.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-canonical-reversed"

      - name: Varied 5000-transfer workload
        shell: bash
        run: |
          set -o pipefail
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/examples/xw-66sat \
            --simulationDuration=8 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/workload/workload-5000-varied.json \
            --transferChunkMode=fixed \
            --transferPayloadBytes=4096 \
            --islMtuBytes=9000 \
            --islQueueBytes=1500000 \
            --transferLogMode=summary \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-scale" \
            | tee /tmp/satcompute-ci-scale.log

      - name: Mixed large workload
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --simulationDuration=45 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/mixed-large-ci.json \
            --transferChunkMode=size-aware \
            --islMtuBytes=65535 \
            --islQueueBytes=1500000 \
            --transferLogMode=summary \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-mixed-large"

      - name: FlowMonitor DropReason
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/fqcodel-bottleneck \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --transferTrace=contrib/satcompute/input/traffic/json/test/fqcodel-bottleneck-transfers.json \
            --diagnosticMode=failure \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1400 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-fqcodel"
          python3 contrib/satcompute/tools/validation/check-flow-drop-reasons.py \
            --output-dir=/tmp/satcompute-ci-fqcodel \
            --require-reason=QUEUE_DISC \
            --forbid-reason=QUEUE \
            --require-zero-unattributed \
            --expected-explicit-drop-packets=6262

      - name: Task single ECMP
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-single-ecmp.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-single"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-single-ecmp.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hrw-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-single-hrw"

      - name: Task FCFS
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-fcfs.json \
            --simulationDuration=4 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-fcfs"

      - name: Task completion policy
        shell: bash
        run: |
          set +e
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-single-ecmp.json \
            --simulationDuration=2 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --taskCompletionPolicy=strict \
            --diagnosticMode=failure \
            --transferChunkMode=size-aware \
            --islMtuBytes=65535 \
            --islQueueBytes=1000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-strict"
          strict_status=$?
          set -e
          test "$strict_status" -eq 1
          python3 contrib/satcompute/tools/validation/check-task-output.py failure \
            --topology-dir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --compute-profile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --task-trace=contrib/satcompute/input/traffic/json/task/test/task-single-ecmp.json \
            --output-dir=/tmp/satcompute-ci-task-strict \
            --require-queue-drop
          python3 contrib/satcompute/tools/validation/check-flow-drop-reasons.py \
            --output-dir=/tmp/satcompute-ci-task-strict \
            --require-reason=QUEUE \
            --forbid-reason=QUEUE_DISC \
            --require-zero-unattributed \
            --expected-explicit-drop-packets=1
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-fcfs.json \
            --simulationDuration=1 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --taskCompletionPolicy=report \
            --diagnosticMode=failure \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-report"
          python3 contrib/satcompute/tools/validation/check-task-output.py stress \
            --topology-dir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --compute-profile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --task-trace=contrib/satcompute/input/traffic/json/task/test/task-fcfs.json \
            --output-dir=/tmp/satcompute-ci-task-report \
            --minimum-completion-rate-percent=0

      - name: Task heterogeneous
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/heterogeneous-compute-profile.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-heterogeneous.json \
            --simulationDuration=4 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-heterogeneous"

      - name: Task order determinism
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-a.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-order-a.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-order-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-a.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-order-b.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-task-order-b"

      - name: Compute profile order determinism
        run: |
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-a.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-order-a.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-profile-order-a"
          ./waf --run-no-build "satcompute \
            --topologyDir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --computeProfile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-b.json \
            --taskTrace=contrib/satcompute/input/traffic/json/task/test/task-order-a.json \
            --simulationDuration=3 \
            --offeredLoad=0 \
            --taskLogMode=silent \
            --transferChunkMode=fixed \
            --transferPayloadBytes=1024 \
            --islMtuBytes=1500 \
            --islQueueBytes=1500000 \
            --transferLogMode=silent \
            --routingMode=global-hash-per-flow \
            --ecmpHashSeed=1 \
            --outputDir=/tmp/satcompute-ci-profile-order-b"

      - name: Check deterministic outputs
        run: |
          python3 contrib/satcompute/tools/validation/check-ecmp-output.py \
            --first=/tmp/satcompute-ci-static-a \
            --second=/tmp/satcompute-ci-static-b \
            --dynamic=/tmp/satcompute-ci-dynamic \
            --canonical-first=/tmp/satcompute-ci-canonical-a \
            --canonical-second=/tmp/satcompute-ci-canonical-reversed \
            --remainder=/tmp/satcompute-ci-canonical-a \
            --scale=/tmp/satcompute-ci-scale \
            --scale-input=contrib/satcompute/input/traffic/json/workload/workload-5000-varied.json \
            --scale-log=/tmp/satcompute-ci-scale.log \
            --large=/tmp/satcompute-ci-mixed-large \
            --large-input=contrib/satcompute/input/traffic/json/test/mixed-large-ci.json
          python3 contrib/satcompute/tools/validation/check-ecmp-output.py \
            --canonical-first=/tmp/satcompute-ci-canonical-a \
            --canonical-second=/tmp/satcompute-ci-canonical-order-b

      - name: Check task outputs
        run: |
          python3 contrib/satcompute/tools/validation/check-task-output.py \
            --topology-dir=contrib/satcompute/input/topology/json/tests/diamond-4-static \
            --single-output=/tmp/satcompute-ci-task-single \
            --hrw-single-output=/tmp/satcompute-ci-task-single-hrw \
            --single-profile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --single-trace=contrib/satcompute/input/traffic/json/task/test/task-single-ecmp.json \
            --fcfs-output=/tmp/satcompute-ci-task-fcfs \
            --fcfs-profile=contrib/satcompute/input/topology/json/resources/test/diamond-4-compute-profile.json \
            --fcfs-trace=contrib/satcompute/input/traffic/json/task/test/task-fcfs.json \
            --heterogeneous-output=/tmp/satcompute-ci-task-heterogeneous \
            --heterogeneous-profile=contrib/satcompute/input/topology/json/resources/test/heterogeneous-compute-profile.json \
            --heterogeneous-trace=contrib/satcompute/input/traffic/json/task/test/task-heterogeneous.json \
            --task-order-first-output=/tmp/satcompute-ci-task-order-a \
            --task-order-second-output=/tmp/satcompute-ci-task-order-b \
            --task-order-profile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-a.json \
            --task-order-first-trace=contrib/satcompute/input/traffic/json/task/test/task-order-a.json \
            --task-order-second-trace=contrib/satcompute/input/traffic/json/task/test/task-order-b.json \
            --profile-order-first-output=/tmp/satcompute-ci-profile-order-a \
            --profile-order-second-output=/tmp/satcompute-ci-profile-order-b \
            --profile-order-first-profile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-a.json \
            --profile-order-second-profile=contrib/satcompute/input/topology/json/resources/test/compute-profile-order-b.json \
            --profile-order-trace=contrib/satcompute/input/traffic/json/task/test/task-order-a.json

      - name: Generated task workload contract
        run: |
          python3 contrib/satcompute/tools/generation/generate-task-workload.py \
            --nodes-file=contrib/satcompute/input/topology/json/examples/xw-66sat-static-2g/nodes_0s.json \
            --compute-profile=contrib/satcompute/input/topology/json/resources/workload/xw-66sat-static-2g-compute-profile.json \
            --task-count=40 \
            --total-input-bytes=4000000 \
            --seed=n1-ci \
            --rules-version=n1.6-v1 \
            --arrival-start-ns=1000000000 \
            --arrival-end-ns=10000000000 \
            --arrival-mode=uniform \
            --large-1gb-count=20 \
            --large-500mb-count=40 \
            --scenario-scale-bp=0 \
            --non-tail-min-input-bytes=4096 \
            --non-tail-max-input-bytes=500000 \
            --output-task-trace=/tmp/satcompute-ci-generated-a.json \
            --output-workload-summary=/tmp/satcompute-ci-generated-a-summary.json

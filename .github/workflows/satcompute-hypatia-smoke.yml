name: SatCompute Hypatia Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/satcompute-hypatia-smoke.yml"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "contrib/satcompute/tools/generation/topology/**"
  push:
    branches:
      - main
      - feature/n2-integration
    paths:
      - ".github/workflows/satcompute-hypatia-smoke.yml"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "contrib/satcompute/tools/generation/topology/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satcompute-hypatia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hypatia-smoke:
    name: hypatia-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.25"
          python-version: "3.10.12"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Hypatia/vendor unit tests
        run: >-
          uv run --locked python -m unittest discover
          -s contrib/satcompute/tools/generation/topology/tests
          -p 'test_*.py' -v

      - name: Hypatia position smoke
        run: >-
          uv run --locked python -m
          contrib.satcompute.tools.generation.topology.orbit.hypatia.smoke_positions
          --json

      - name: Synthetic 66 constellation contract
        run: >-
          uv run --locked python -m
          contrib.satcompute.tools.generation.topology.orbit.hypatia.resolve_constellation
          --output-dir /tmp/satcompute-synthetic-66

      - name: Dynamic ISL smoke
        run: >-
          uv run --locked python -m
          contrib.satcompute.tools.generation.topology.dynamic.generate_dynamic_isls
          --config contrib/satcompute/tools/generation/topology/config/synthetic-66.json
          --duration-s 120
          --step-s 60
          --output-dir /tmp/satcompute-dynamic-isls

      - name: Verify clean source tree
        run: test -z "$(git status --short)"

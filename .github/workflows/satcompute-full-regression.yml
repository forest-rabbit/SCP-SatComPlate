name: SatCompute Full Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: satcompute-full-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: full-regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: ./waf configure --disable-examples --disable-tests --enable-modules=satcompute

      - name: Build
        run: ./waf build

      - name: Core routing contracts
        run: contrib/satcompute/tests/integration/smoke/run-routing-smoke.sh

      - name: Core task contracts
        run: contrib/satcompute/tests/integration/smoke/run-task-smoke.sh

      - name: Core diagnostics contracts
        run: contrib/satcompute/tests/integration/smoke/run-diagnostics-smoke.sh

      - name: Extended routing regression
        run: contrib/satcompute/tools/ci/run-full-routing-regression.sh

      - name: Extended workload regression
        run: contrib/satcompute/tools/ci/run-full-workload-regression.sh

      - name: Verify clean source tree
        run: test -z "$(git status --short)"

      - name: Publish Full Regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success)
              state=success
              ;;
            *)
              state=failure
              ;;
          esac
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${state}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"description\":\"Full Regression ${JOB_STATUS}\",\"context\":\"satcompute/full-regression\"}"

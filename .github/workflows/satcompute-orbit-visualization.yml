name: SatCompute Orbit Visualization

on:
  pull_request:
    paths:
      - ".github/workflows/satcompute-orbit-visualization.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "contrib/satcompute/tools/generation/scenario/**"
      - "contrib/satcompute/tools/generation/topology/**"
      - "contrib/satcompute/tools/visualization/**"
      - "contrib/satcompute/tests/support/**"
      - "contrib/satcompute/tests/integration/smoke/orbit_visualization.py"
      - "contrib/satcompute/tests/unit/visualization/orbit/**"
  push:
    branches:
      - feature/n2-integration
    paths:
      - ".github/workflows/satcompute-orbit-visualization.yml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
      - "contrib/satcompute/tools/generation/scenario/**"
      - "contrib/satcompute/tools/generation/topology/**"
      - "contrib/satcompute/tools/visualization/**"
      - "contrib/satcompute/tests/support/**"
      - "contrib/satcompute/tests/integration/smoke/orbit_visualization.py"
      - "contrib/satcompute/tests/unit/visualization/orbit/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satcompute-orbit-visualization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orbit-visualization:
    name: orbit-visualization
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/satcompute-matplotlib

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.25"
          python-version: "3.10.12"

      - name: Verify locked dependencies
        run: uv lock --check

      - name: Sync visualization dependency group
        run: uv sync --locked --group visualization

      - name: Visualization unit tests
        run: >-
          uv run --locked --group visualization python -m unittest discover
          -s contrib/satcompute/tests/unit/visualization/orbit
          -p 'test_*.py' -v

      - name: Agg headless 66-satellite smoke
        run: >-
          uv run --locked --group visualization python -m
          contrib.satcompute.tests.integration.smoke.orbit_visualization
          --work-dir /tmp/satcompute-orbit-headless

      - name: Tiny Pillow GIF smoke
        run: >-
          uv run --locked --group visualization python -m
          contrib.satcompute.tests.integration.smoke.orbit_visualization
          --work-dir /tmp/satcompute-orbit-gif
          --export-gif

      - name: Python compile check
        run: >-
          uv run --locked --group visualization python -m compileall -q
          contrib/satcompute/tools/visualization/orbit

      - name: Verify patch formatting
        run: git diff --check

      - name: Verify clean source tree
        run: test -z "$(git status --short)"
